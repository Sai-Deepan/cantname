baseURL = "https://example.org/"
languageCode = "en-us"
title = "TestSite"
enableRobotsTXT = true

buildDrafts = false
buildFuture = false
buildExpired = false

uglyURLs = false
canonifyURLs = true
relativeURLs = false

[pagination]
  pagerSize = 12

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

  [markup.highlight]
    style = "monokai"
    lineNos = true
    noClasses = false

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[taxonomies]
  author = "authors"
  concept = "concepts"
  era = "eras"
  tag = "tags"

[permalinks]
  research = "/research/:slug/"
  timeline = "/timeline/:slug/"
  docs = "/docs/:slug/"
  author = "/author/:slug/"

[menu]
  [[menu.main]]
    name = "/about"
    url = "/about/"
    weight = 1

  [[menu.main]]
    name = "/timeline"
    url = "/timeline/"
    weight = 2

  [[menu.main]]
    name = "/author"
    url = "/author/"
    weight = 3

  [[menu.main]]
    name = "/research"
    url = "/research/"
    weight = 4

  [[menu.main]]
    name = "/docs"
    url = "/docs/"
    weight = 5

  [[menu.main]]
    name = "/contribute"
    url = "/contribute/"
    weight = 6

[params]
  description = "Understanding computing systems from original design. No folklore. No magic."
  defaultTheme = "dark"

  pdfDisclaimer = "Primary sources are linked for scholarly reference. Rights remain with original authors."

  archivePrinciples = [
    "Original authors only",
    "Primary sources over commentary",
    "Design intent before implementation",
    "No tutorials, no shortcuts"
  ]
